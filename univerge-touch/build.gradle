plugins {
    id "com.android.library" version "8.7.3"
    id "maven-publish"
}

android {
    namespace "com.zhifaios.eyes.aispect"
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.zhifaios.eyes"
                artifactId = "aispect-touch-android"
                version = "1.1.0"
            }
        }
    }
}
